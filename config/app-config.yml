version: "2.0.0"
app_name: "DevOps-Diagnostics-App"

environments:
  development:
    server:
      host: "localhost"
      port: 8080
    database:
      type: "sqlite"
      name: "dev_db.sqlite"
    features:
      debug: true
      replicas: 1

  staging:
    server:
      host: "staging.diagnostics.com"
      port: 80
    database:
      type: "postgresql"
      name: "staging_db"
    features:
      debug: true
      replicas: 2

  production:
    server:
      host: "api.diagnostics.com"
      port: 443
    database:
      type: "postgresql"
      name: "prod_db_v2"
    features:
      debug: false
      replicas: 5
      ssl_enabled: true
